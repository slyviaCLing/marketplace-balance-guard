[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketplace-balance-guard"
version = "0.1.0"
description = "Keep marketplace order handoffs moving with balance-aware recharge notifications."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/marketplace_balance_guard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

